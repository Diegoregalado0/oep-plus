services:
  db:
    image: postgres:16-alpine
    container_name: oep-db
    environment:
      POSTGRES_USER: oep
      POSTGRES_PASSWORD: oep
      POSTGRES_DB: oep
    ports:
      - "55432:5432"
    volumes:
      - oep-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oep -d oep"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  oep-pgdata:
